[package]
name = "curatom-dashboard"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
base64 = "0.22"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlScriptElement",
  "HtmlInputElement",
  "DomTokenList",
  "CssStyleDeclaration",
  "PointerEvent",
  "Clipboard",
  "Navigator",
  "Storage",
  # The browser's own WebAuthn API -- a W3C standard with real, typed
  # web-sys bindings, unlike Turnstile's SDK (turnstile.rs), which has none
  # and has to be reached with js-sys Reflect calls instead.
  "CredentialsContainer",
  "Credential",
  "CredentialCreationOptions",
  "CredentialRequestOptions",
  "PublicKeyCredential",
  "PublicKeyCredentialCreationOptions",
  "PublicKeyCredentialRequestOptions",
  "PublicKeyCredentialRpEntity",
  "PublicKeyCredentialUserEntity",
  "PublicKeyCredentialParameters",
  "PublicKeyCredentialType",
  "AuthenticatorSelectionCriteria",
  "AuthenticatorAttachment",
  "UserVerificationRequirement",
  "AttestationConveyancePreference",
  "AuthenticatorAttestationResponse",
  "AuthenticatorAssertionResponse",
]

[profile.release]
opt-level = "z"
lto = true
