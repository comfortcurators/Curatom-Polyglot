[package]
name = "curatom-dashboard"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-file = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
base64 = "0.22"
# Client-side .zip extraction for the Data plate's upload flow -- the
# archive never leaves the browser as a blob, only the decoded per-file
# text does (same JSON shape `h_upload_repository` already accepts).
# `deflate` (miniz_oxide, pure Rust) not `deflate64`/`bzip2`/`zstd`, which
# pull in C or asm code that does not target wasm32-unknown-unknown.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlScriptElement",
  "HtmlInputElement",
  "DomTokenList",
  "CssStyleDeclaration",
  "PointerEvent",
  "Clipboard",
  "Navigator",
  "Storage",
  # The browser's own WebAuthn API -- a W3C standard with real, typed
  # web-sys bindings, unlike Turnstile's SDK (turnstile.rs), which has none
  # and has to be reached with js-sys Reflect calls instead.
  "CredentialsContainer",
  "Credential",
  "CredentialCreationOptions",
  "CredentialRequestOptions",
  "PublicKeyCredential",
  "PublicKeyCredentialCreationOptions",
  "PublicKeyCredentialRequestOptions",
  "PublicKeyCredentialRpEntity",
  "PublicKeyCredentialUserEntity",
  "PublicKeyCredentialParameters",
  "PublicKeyCredentialType",
  "AuthenticatorSelectionCriteria",
  "AuthenticatorAttachment",
  "UserVerificationRequirement",
  "AttestationConveyancePreference",
  "AuthenticatorAttestationResponse",
  "AuthenticatorAssertionResponse",
  # File upload for the Data plate's .zip flow -- reading the bytes
  # themselves goes through gloo-file, which brings its own FileReader
  # binding; these two are only for pulling the chosen File out of the
  # <input type="file"> element itself.
  "File",
  "FileList",
]

[profile.release]
opt-level = "z"
lto = true
