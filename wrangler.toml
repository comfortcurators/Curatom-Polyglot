name = "curatom-kernel"
main = "workers/api/build/worker/shim.mjs"
compatibility_date = "2026-09-01"

# workers.dev enabled deliberately, 16 Sep 2026: the founder wants token-only
# entry (RAJ_TOKEN, ?token= in a plain browser tab) without Cloudflare
# Access's email/OTP flow in front of it. That's safe now specifically
# because the Cf-Access-* header-trust branches this comment used to warn
# about are gone from CloudflareAccessIdentityProvider::authenticate --
# RAJ_TOKEN and CURATOM_ENV=development's dev header are the only two
# paths in, and neither is a header Cloudflare happens to pass through
# unmodified. Re-disabling this without also restoring real JWT
# verification first would be the old vulnerability again.
workers_dev = true

[build]
command = "cd apps/dashboard && trunk build --release && cd ../../workers/api && worker-build --release"

[[durable_objects.bindings]]
name = "CURATOM_KERNEL"
class_name = "CuratomKernel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CuratomKernel"]

[[durable_objects.bindings]]
name = "SCRATCHPAD"
class_name = "Scratchpad"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Scratchpad"]

[[d1_databases]]
binding = "CURATOM_LEDGER"
database_name = "curatom-ledger"
# Cloudflare team: npx wrangler d1 create curatom-ledger, paste the id here.
database_id = "daf59f1c-9003-4bff-92bf-18b15586d523"
# wrangler.toml lives at the repo root, but the crate whose schema this
# is belongs to (workers/api) does not -- without this, `wrangler d1
# migrations apply` looks for a `./migrations` next to this file and
# finds nothing.
migrations_dir = "workers/api/migrations"

[[r2_buckets]]
binding = "CURATOM_ARTIFACTS"
bucket_name = "curatom-artifacts"

[[routes]]
pattern = "curatom.rajvansh.dev"
custom_domain = true

[[services]]
binding = "CURATOM_ORCHESTRATOR"
service = "curatom-orchestrator"

# Real data for the dashboard, read live through hostos-mcp's own GitHub
# App and Cloudflare credentials -- never held here. hostos-mcp admits
# "curatom-kernel" as a known internal caller (identity.ts) and this
# route only ever asks for the "oauth" (read-only + curator_act) scope.
[[services]]
binding = "HOSTOS_MCP"
service = "hostos-mcp"

# The web dashboard: Rust compiled to WASM via Leptos + Trunk
# (apps/dashboard), not TypeScript/React -- one language across the whole
# stack, same as the Rust kernel it talks to. The swipe/zoom UI uses raw
# pointer events + CSS transforms plus the browser's native View
# Transition API for the tile<->fullscreen morph, no JS animation library.
# Same hostname as the API -- one login, one bookmark, no CORS. API paths
# always go to the Rust worker; everything else is the dashboard, falling
# back to index.html for client routing.
[assets]
directory = "./apps/dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/organic/*", "/inorganic/*", "/internal/*", "/llm-guide", "/health", "/scratch/*", "/mcp", "/tools/list", "/tools/call", "/auth/*"]

[vars]
CURATOM_OWNER_ID = "organic_rajvansh"
VALHALLA_URL = "https://valhalla.rajvansh.dev"
# Verified sender per ZeptoMail's own console: Domain/Sender Address =
# rajvansh.dev, so this is the only address that will actually send.
EMAIL_FROM = "noreply@rajvansh.dev"
