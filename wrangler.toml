name = "curatom-kernel"
main = "workers/api/build/worker/shim.mjs"
compatibility_date = "2026-09-01"

# No *.workers.dev fallback. CloudflareAccessIdentityProvider treats the mere
# presence of cf-access-jwt-assertion as the owner -- it does not verify the
# JWT (see DEFERRED.md). That is only safe behind a route Cloudflare Access
# actually enforces. A live workers.dev URL bypasses Access entirely and lets
# anyone set that header themselves. Deploy on the custom domain only.
workers_dev = false

[build]
command = "cd apps/dashboard && npm install && npm run build && cd ../../workers/api && worker-build --release"

[[durable_objects.bindings]]
name = "CURATOM_KERNEL"
class_name = "CuratomKernel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CuratomKernel"]

[[durable_objects.bindings]]
name = "SCRATCHPAD"
class_name = "Scratchpad"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Scratchpad"]

[[d1_databases]]
binding = "CURATOM_LEDGER"
database_name = "curatom-ledger"
# Cloudflare team: npx wrangler d1 create curatom-ledger, paste the id here.
database_id = "daf59f1c-9003-4bff-92bf-18b15586d523"

[[r2_buckets]]
binding = "CURATOM_ARTIFACTS"
bucket_name = "curatom-artifacts"

[[routes]]
pattern = "curatom.rajvansh.dev"
custom_domain = true

[[services]]
binding = "CURATOM_ORCHESTRATOR"
service = "curatom-orchestrator"

# The web dashboard: a Vite + React + Framer Motion SPA (apps/dashboard),
# not Expo/React Native Web -- it never shipped as a native app, and the
# swipe/zoom UI needs real CSS transforms and spring physics, not RN's
# View/StyleSheet abstraction. Same hostname as the API -- one login, one
# bookmark, no CORS. API paths always go to the Rust worker; everything
# else is the dashboard, falling back to index.html for client routing.
[assets]
directory = "./apps/dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/organic/*", "/inorganic/*", "/internal/*", "/llm-guide", "/health", "/scratch/*"]

[vars]
CURATOM_OWNER_ID = "organic_rajvansh"
VALHALLA_URL = "https://valhalla.rajvansh.dev"
