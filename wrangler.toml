name = "curatom-kernel"
main = "workers/api/build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
command = "cd workers/api && worker-build --release"

[[durable_objects.bindings]]
name = "CURATOM_KERNEL"
class_name = "CuratomKernel"

[[migrations]]
tag = "v1"
new_classes = ["CuratomKernel"]

[[r2_buckets]]
binding = "CURATOM_ARTIFACTS"
bucket_name = "curatom-artifacts"

[vars]
CURATOM_OWNER_ID = "organic_rajvansh"
CURATOM_ORCHESTRATOR_URL = "http://localhost:4000"
