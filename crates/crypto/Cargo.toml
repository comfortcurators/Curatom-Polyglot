[package]
name = "curatom-crypto"
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Unconditional (not just under the wasm target below): password/session
# secrets are generated in tests (native) too, and the OS-backed native
# implementation is exactly as trustworthy as the wasm `js` one is.
getrandom = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }
