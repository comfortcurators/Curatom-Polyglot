[package]
name = "curatom-substrate-cloudflare"
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
async-trait = "0.1"
curatom-ports = { path = "../ports" }
curatom-protocol = { path = "../protocol" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
worker = "0.8.5"
