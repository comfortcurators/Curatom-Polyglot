[package]
name = "curatom-webauthn"
version = "0.1.0"
edition = "2021"

# Pure Rust, no JS, no platform crypto: ciborium parses what the
# authenticator sends back, p256 verifies the signature it made. Both
# compile to wasm32-unknown-unknown for the Worker AND run natively, so
# the verification path below is provable by `cargo test` before it ever
# guards a real account.
[dependencies]
ciborium = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
