[package]
name = "curatom-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.5", features = ["d1"] }
worker-macros = "0.8.5"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"

curatom-protocol = { path = "../../crates/protocol" }
curatom-crypto = { path = "../../crates/crypto" }
curatom-ports = { path = "../../crates/ports" }
curatom-key-kernel = { path = "../../crates/key-kernel" }
curatom-sign = { path = "../../crates/sign" }
curatom-organic-router = { path = "../../crates/organic-router" }
curatom-inorganic-router = { path = "../../crates/inorganic-router" }
curatom-attestation = { path = "../../crates/attestation" }
curatom-substrate-cloudflare = { path = "../../crates/substrate-cloudflare" }
curatom-resource-registry = { path = "../../crates/resource-registry" }
curatom-webauthn = { path = "../../crates/webauthn" }

# wasm-opt is an optional size/speed optimization pass, not required for
# correctness. worker-build tries to download the binaryen release on
# every build; this environment's proxy doesn't trust that download's
# cert chain (same as the wasm-bindgen download this build already
# works around via WASM_BINDGEN_BIN). Disabled rather than chasing a
# second binary override -- unoptimized wasm still runs correctly, just
# larger. Re-enable if bundle size ever matters enough to fix properly.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
