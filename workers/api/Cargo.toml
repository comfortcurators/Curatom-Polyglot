[package]
name = "curatom-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.5"
worker-macros = "0.8.5"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"

curatom-protocol = { path = "../../crates/protocol" }
curatom-crypto = { path = "../../crates/crypto" }
curatom-ports = { path = "../../crates/ports" }
curatom-key-kernel = { path = "../../crates/key-kernel" }
curatom-sign = { path = "../../crates/sign" }
curatom-organic-router = { path = "../../crates/organic-router" }
curatom-inorganic-router = { path = "../../crates/inorganic-router" }
curatom-attestation = { path = "../../crates/attestation" }
curatom-substrate-cloudflare = { path = "../../crates/substrate-cloudflare" }
