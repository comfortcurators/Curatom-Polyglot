name = "curatom-orchestrator"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Service-binding only. A workers.dev URL would be a public POST /v1/jobs.
workers_dev = false

[[containers]]
class_name = "OrchestratorContainer"
image = "../../orchestrator/Dockerfile"
instance_type = "standard-4"
max_instances = 1

[[durable_objects.bindings]]
name = "ORCHESTRATOR"
class_name = "OrchestratorContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrchestratorContainer"]

[[services]]
binding = "CURATOM_KERNEL_INTERNAL"
service = "curatom-kernel"

[[services]]
binding = "HOSTOS_MCP"
service = "hostos-mcp"
