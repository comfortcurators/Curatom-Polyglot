name = "curatom-valhalla"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# SDK Sandbox is the container. SandboxDO stays exported because v1
# already created that sqlite class; it is not the runtime path.
[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
max_instances = 10
instance_type = "basic"

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[durable_objects.bindings]]
name = "SandboxDO"
class_name = "SandboxDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SandboxDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]

[[r2_buckets]]
binding = "CURATOM_ARTIFACTS"
bucket_name = "curatom-artifacts"

[[d1_databases]]
binding = "CURATOM_LEDGER"
database_name = "curatom-ledger"
database_id = "daf59f1c-9003-4bff-92bf-18b15586d523"

[[services]]
binding = "CURATOM_KERNEL"
service = "curatom-kernel"

[vars]
VALHALLA_BASE_URL = "https://valhalla.rajvansh.dev"
