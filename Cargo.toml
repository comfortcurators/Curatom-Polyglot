[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/crypto",
    "crates/ports",
    "crates/key-kernel",
    "crates/resource-registry",
    "crates/sign",
    "crates/attestation",
    "crates/execution",
    "crates/organic-router",
    "crates/inorganic-router",
    "crates/substrate-memory",
]
exclude = [
    "workers/api",
    "crates/substrate-cloudflare",
    "apps/dashboard",
]
# workers/api, crates/substrate-cloudflare and apps/dashboard are wasm-only
# (workers-rs and Leptos respectively, with their own wasm-bindgen version
# each). They are not workspace members so `cargo test --workspace` stays
# native, and their independent wasm-bindgen versions never collide in one
# resolver pass. Build the worker with wrangler / cargo check --target
# wasm32-unknown-unknown from workers/api; build the dashboard with trunk
# from apps/dashboard, once the wasm target is installed.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Comfort Curators Private Limited"]
publish = false

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
getrandom = "0.2"
